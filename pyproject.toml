[project]
name = "nnact"
version = "0.1.0"
description = "Model-agnostic activation extraction and HDF5 caching for PyTorch models"
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.16.0",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
examples = [
    "datasets>=5.0.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.5",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
ignoreMissingTypeStubs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
